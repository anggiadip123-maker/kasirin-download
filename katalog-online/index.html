<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katalog Produk</title>
<meta name="description" content="Katalog produk online, pesan langsung lewat WhatsApp.">
<link rel="icon" type="image/png" href="../icon.png">
<style>
  :root{--navy:#0F2C56;--orange:#FF7A00;--tosca:#00C2A8;--bg:#F6F8FB;--ink:#101828;--muted:#5B6678;--line:#E2E7EF;--card:#fff;--good:#16A34A;--bad:#DC2626}
  @media (prefers-color-scheme:dark){:root{--bg:#0B1220;--ink:#EEF2F8;--muted:#9AA7BA;--line:#22304A;--card:#121B2E}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;padding-bottom:90px}
  header.top{background:linear-gradient(135deg,var(--navy),#163d78);color:#fff;padding:22px 18px 26px}
  header.top .brand{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--tosca);text-transform:uppercase;margin-bottom:10px}
  header.top h1{margin:0 0 6px;font-size:clamp(20px,5.5vw,26px);line-height:1.2}
  header.top .meta{font-size:13px;opacity:.85;display:flex;flex-direction:column;gap:3px}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}
  .toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;flex-direction:column;gap:10px}
  .searchbox{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  .searchbox input{border:0;background:transparent;outline:0;width:100%;font-size:15px;color:var(--ink)}
  .cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .cats::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chip.active{background:var(--navy);border-color:var(--navy);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:6px 0 20px}
  @media (min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .pcard .ph{aspect-ratio:1;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden;position:relative}
  .pcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .pcard .badge-habis{position:absolute;top:8px;left:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px}
  .pcard .body{padding:10px 11px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
  .pcard .name{font-size:13.5px;font-weight:700;line-height:1.3;min-height:2.6em}
  .pcard .cat{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .pcard .price{font-size:14.5px;font-weight:800;color:var(--navy);margin-top:2px}
  @media (prefers-color-scheme:dark){.pcard .price{color:var(--tosca)}}
  .pcard select.varsel{margin-top:4px;width:100%;font-size:12px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  .addbtn{margin-top:8px;width:100%;padding:9px;border:0;border-radius:10px;background:var(--orange);color:#fff;font-weight:700;font-size:13px;cursor:pointer}
  .addbtn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
  .qtyrow{margin-top:8px;display:flex;align-items:center;justify-content:space-between;background:var(--orange);border-radius:10px;padding:4px}
  .qtyrow button{width:30px;height:30px;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:17px;font-weight:800;border-radius:7px;cursor:pointer}
  .qtyrow span{color:#fff;font-weight:800;font-size:14px}
  .empty{text-align:center;color:var(--muted);padding:50px 16px;font-size:14px}
  .cartbar{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -6px 20px rgba(0,0,0,.18);z-index:20;transform:translateY(110%);transition:transform .22s}
  .cartbar.show{transform:translateY(0)}
  .cartbar .info{font-size:13px;line-height:1.3}
  .cartbar .info b{font-size:16px;display:block}
  .cartbar button{background:var(--orange);color:#fff;border:0;padding:11px 20px;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer}
  .drawer-back{position:fixed;inset:0;background:rgba(10,16,30,.5);z-index:30;display:none;align-items:flex-end;justify-content:center}
  .drawer-back.show{display:flex}
  .drawer{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:82vh;display:flex;flex-direction:column;animation:up .2s ease}
  @keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:translateY(0);opacity:1}}
  .drawer .dhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .drawer .dhead h3{margin:0;font-size:16px}
  .drawer .dhead button{background:none;border:0;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;padding:4px}
  .ditems{overflow-y:auto;padding:8px 18px;flex:1}
  .ditem{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .ditem .thumb{width:46px;height:46px;border-radius:9px;background:var(--bg);overflow:hidden;flex:none}
  .ditem .thumb img{width:100%;height:100%;object-fit:cover}
  .ditem .info{flex:1;min-width:0}
  .ditem .info .n{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ditem .info .v{font-size:11.5px;color:var(--muted)}
  .ditem .info .p{font-size:12.5px;color:var(--muted);margin-top:2px}
  .ditem .qty{display:flex;align-items:center;gap:7px}
  .ditem .qty button{width:26px;height:26px;border:1px solid var(--line);background:var(--bg);border-radius:7px;font-weight:800;cursor:pointer;color:var(--ink)}
  .dfoot{padding:14px 18px 18px;border-top:1px solid var(--line)}
  .namafield{margin-bottom:12px}
  .namafield label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .namafield input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--bg);color:var(--ink);box-sizing:border-box}
  .namafield input.err{border-color:var(--bad)}
  .namafield .errmsg{display:none;color:var(--bad);font-size:11.5px;margin-top:5px}
  .namafield.show-err .errmsg{display:block}
  .namafield.show-err input{border-color:var(--bad)}
  .tipefield{margin-bottom:12px}
  .tipefield label.tlabel{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .tipe-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tipe-opt{padding:11px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:13.5px;font-weight:700;cursor:pointer;text-align:center}
  .tipe-opt.active{background:var(--navy);border-color:var(--navy);color:#fff}
  .tipefield .errmsg{display:none;color:var(--bad);font-size:11.5px;margin-top:5px}
  .tipefield.show-err .errmsg{display:block}
  .tipefield.show-err .tipe-opt{border-color:var(--bad)}
  .dfoot .total{display:flex;justify-content:space-between;font-weight:800;font-size:16px;margin-bottom:12px}
  .wabtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:0;border-radius:12px;background:#25D366;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
  .wabtn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
  .nonumnote{text-align:center;color:var(--bad);font-size:12px;margin:0 0 10px}
  footer.pw{text-align:center;padding:24px 16px;font-size:11.5px;color:var(--muted)}
  footer.pw a{color:inherit;font-weight:700}
  .state{text-align:center;padding:60px 20px;color:var(--muted)}
</style>
</head>
<body>

<div id="app">
  <div class="state" id="stateMsg">Memuat katalog…</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
(function(){
  "use strict";
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyBjRXZkhWpl-3VVpGm63qfm8huxgDnWnic",
    authDomain: "kasirin-ac135.firebaseapp.com",
    projectId: "kasirin-ac135",
    storageBucket: "kasirin-ac135.firebasestorage.app",
    messagingSenderId: "275404503053",
    appId: "1:275404503053:web:78d807d271aa203556bd44",
    measurementId: "G-7HBEPPY3W7"
  };
  const $ = (s,el=document)=>el.querySelector(s);
  const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const rp = n => "Rp"+Math.round(n||0).toLocaleString("id-ID");
  const catIcon = cat => ({Makanan:"🍜",Minuman:"🥤",Snack:"🍪",Dessert:"🍰"}[cat] || "🛍️");

  const params = new URLSearchParams(location.search);
  const storeKey = (params.get("toko")||"").trim().toUpperCase().replace(/[^A-Z0-9]+/g,"");

  function showState(msg){ $("#app").innerHTML = `<div class="state">${msg}</div>`; }

  if(!storeKey){
    showState("Link katalog tidak lengkap. Minta link yang benar dari tokonya ya.");
    return;
  }

  let store=null, products=[], cart={}, orderTipe=null; // cart key -> {id,name,photo,price,qty,variantLabel}; orderTipe: "dinein" | "takeaway"

  function normalizePhone(telp){
    let d=String(telp||"").replace(/\D/g,"");
    if(!d) return "";
    if(d.startsWith("0")) d="62"+d.slice(1);
    else if(!d.startsWith("62")) d="62"+d;
    return d;
  }

  function cartKey(p, variantOpt){ return p.id + (variantOpt?("::"+variantOpt):""); }
  function priceFor(p, variantOpt){
    if(p.variant && p.variant.priceDiff && variantOpt && p.variant.prices && p.variant.prices[variantOpt]!=null) return p.variant.prices[variantOpt];
    return p.price||0;
  }

  function addToCart(p, variantOpt){
    const key=cartKey(p,variantOpt);
    if(cart[key]) cart[key].qty++;
    else cart[key]={ id:p.id, name:p.name, photo:p.photo, price:priceFor(p,variantOpt), qty:1, variantLabel:variantOpt||"" };
    renderCartBar(); renderGrid();
  }
  function changeQty(key, delta){
    const it=cart[key]; if(!it) return;
    it.qty+=delta;
    if(it.qty<=0) delete cart[key];
    renderCartBar(); renderDrawer(); renderGrid();
  }
  function cartCount(){ return Object.values(cart).reduce((a,i)=>a+i.qty,0); }
  function cartTotal(){ return Object.values(cart).reduce((a,i)=>a+i.qty*i.price,0); }
  function qtyInCart(p){
    // total qty produk ini di keranjang (gabung semua varian)
    return Object.values(cart).filter(i=>i.id===p.id).reduce((a,i)=>a+i.qty,0);
  }

  let search="", activeCat="Semua";

  function filteredProducts(){
    return products.filter(p=>{
      if(activeCat!=="Semua" && (p.cat||"Lainnya")!==activeCat) return false;
      if(search && !p.name.toLowerCase().includes(search.toLowerCase())) return false;
      return true;
    });
  }

  function productCardHTML(p){
    const habis = p.tersedia===false;
    const hasVariant = p.variant && p.variant.options && p.variant.options.length;
    const img = p.photo ? `<img src="${p.photo}" alt="">` : catIcon(p.cat);
    const inCartQty = !hasVariant ? qtyInCart(p) : 0;
    const price = hasVariant && !p.variant.priceDiff ? p.price : (hasVariant ? null : p.price);
    return `<div class="pcard" data-pid="${esc(p.id)}">
      <div class="ph">${img}${habis?'<span class="badge-habis">Habis</span>':''}</div>
      <div class="body">
        <div class="cat">${esc(p.cat||"Lainnya")}</div>
        <div class="name">${esc(p.name)}</div>
        ${hasVariant
          ? `<div class="price">${p.variant.priceDiff? "Mulai "+rp(Math.min(...p.variant.options.map(o=>p.variant.prices&&p.variant.prices[o]!=null?p.variant.prices[o]:p.price))) : rp(p.price)}</div>
             <select class="varsel" ${habis?"disabled":""}>${p.variant.options.map(o=>`<option value="${esc(o)}">${esc(o)}${p.variant.priceDiff&&p.variant.prices&&p.variant.prices[o]!=null?" — "+rp(p.variant.prices[o]):""}</option>`).join("")}</select>
             <button class="addbtn" data-add="1" ${habis?"disabled":""}>${habis?"Stok habis":"+ Tambah"}</button>`
          : (inCartQty>0
              ? `<div class="price">${rp(price)}</div>
                 <div class="qtyrow"><button data-dec="1">−</button><span>${inCartQty}</span><button data-inc="1">+</button></div>`
              : `<div class="price">${rp(price)}</div>
                 <button class="addbtn" data-add="1" ${habis?"disabled":""}>${habis?"Stok habis":"+ Tambah"}</button>`)
        }
      </div>
    </div>`;
  }

  function renderCats(){
    const cats=["Semua", ...new Set(products.map(p=>p.cat||"Lainnya"))];
    const el=$("#catChips"); if(!el) return;
    el.innerHTML = cats.map(c=>`<button class="chip ${c===activeCat?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  }

  function renderGrid(){
    const el=$("#grid"); if(!el) return;
    const list=filteredProducts();
    el.innerHTML = list.length ? list.map(productCardHTML).join("") : `<div class="empty" style="grid-column:1/-1">Produk tidak ditemukan</div>`;
  }

  function renderCartBar(){
    const bar=$("#cartBar"); if(!bar) return;
    const n=cartCount();
    if(n<=0){ bar.classList.remove("show"); return; }
    bar.classList.add("show");
    $("#cartBarInfo").innerHTML = `${n} item<b>${rp(cartTotal())}</b>`;
  }

  function renderDrawer(){
    const wrap=$("#ditems"); if(!wrap) return;
    const items=Object.entries(cart);
    wrap.innerHTML = items.length ? items.map(([key,it])=>`
      <div class="ditem" data-key="${esc(key)}">
        <div class="thumb">${it.photo?`<img src="${it.photo}" alt="">`:""}</div>
        <div class="info">
          <div class="n">${esc(it.name)}</div>
          ${it.variantLabel?`<div class="v">${esc(it.variantLabel)}</div>`:""}
          <div class="p">${rp(it.price)} x ${it.qty}</div>
        </div>
        <div class="qty"><button data-dec="1">−</button><span>${it.qty}</span><button data-inc="1">+</button></div>
      </div>`).join("") : `<div class="empty">Keranjang masih kosong</div>`;
    $("#dTotal").textContent = rp(cartTotal());
  }

  function openDrawer(){ renderDrawer(); $("#drawerBack").classList.add("show"); }
  function closeDrawer(){ $("#drawerBack").classList.remove("show"); }

  function sendToWhatsApp(){
    const items=Object.values(cart);
    if(!items.length) return;
    const phone=normalizePhone(store && store.telp);
    if(!phone) return; // tombol sudah dinonaktifkan kalau toko belum punya nomor, ini jaga-jaga saja
    const nama=$("#namaPemesan").value.trim();
    if(!nama){
      $("#namaField").classList.add("show-err");
      $("#namaPemesan").focus();
      return;
    }
    $("#namaField").classList.remove("show-err");
    if(!orderTipe){
      $("#tipeField").classList.add("show-err");
      return;
    }
    $("#tipeField").classList.remove("show-err");
    const tipeLabel = orderTipe==="dinein" ? "Makan di Tempat" : "Bawa Pulang";
    const lines=items.map(it=>`- ${it.name}${it.variantLabel?" ("+it.variantLabel+")":""} x${it.qty} = ${rp(it.price*it.qty)}`);
    const text = `Halo, saya ${nama} mau pesan dari ${store&&store.nama?store.nama:"katalog"} (${tipeLabel}):\n\n${lines.join("\n")}\n\nTotal: ${rp(cartTotal())}\n\nNama: ${nama}\nTipe: ${tipeLabel}\n\nMohon info selanjutnya ya. Terima kasih.`;
    // Selalu ke nomor WhatsApp yang terdaftar di toko (store.telp) -- tidak pernah ke wa.me/?text=
    // generik (itu cuma buka menu pilih kontak sendiri, bukan ke toko), makanya tombolnya
    // dinonaktifkan dari awal kalau toko belum isi nomor, daripada diam-diam salah sasaran.
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
    // Dibuka SEGERA/sinkron (bukan setelah await) supaya tidak diblokir popup blocker browser.
    // Pesan WA adalah jalur utama yang HARUS selalu terkirim; simpan ke Firestore di bawah ini
    // cuma pelengkap (biar kasir bisa auto-isi keranjang), jadi dibuat fire-and-forget --
    // kalaupun gagal/offline, pesanan via WA tetap jalan seperti biasa.
    window.open(url, "_blank");
    savePesananOnline(nama, items, orderTipe);
  }
  async function savePesananOnline(nama, items, tipe){
    try{
      if(!db) return;
      await ensureAuth();
      const orderItems = items.map(it=>({ id: it.id, name: it.name, variantLabel: it.variantLabel||"", price: it.price, qty: it.qty }));
      await db.collection("katalogToko").doc(storeKey).collection("pesanan").add({
        nama, tipe: tipe||"", items: orderItems, total: cartTotal(), status: "baru", createdAt: new Date().toISOString()
      });
    }catch(e){ /* diam-diam, tidak mengganggu -- pesanan via WA tetap terkirim */ }
  }

  function renderShell(){
    $("#app").innerHTML = `
      <header class="top">
        <div class="wrap">
          <div class="brand">🛒 Katalog Online</div>
          <h1>${esc(store.nama||"Toko")}</h1>
          <div class="meta">
            ${store.alamat?`<span>📍 ${esc(store.alamat)}</span>`:""}
            ${store.telp?`<span>📞 ${esc(store.telp)}</span>`:""}
          </div>
        </div>
      </header>
      <div class="wrap">
        <div class="toolbar">
          <div class="searchbox">🔍 <input id="searchInput" placeholder="Cari produk…" autocomplete="off"></div>
          <div class="cats" id="catChips"></div>
        </div>
        <div class="grid" id="grid"></div>
      </div>
      <div class="cartbar" id="cartBar">
        <div class="info" id="cartBarInfo"></div>
        <button id="openCartBtn" type="button">Lihat Keranjang</button>
      </div>
      <div class="drawer-back" id="drawerBack">
        <div class="drawer">
          <div class="dhead"><h3>Keranjang Pesanan</h3><button id="closeDrawerBtn" type="button">✕</button></div>
          <div class="ditems" id="ditems"></div>
          <div class="dfoot">
            <div class="namafield" id="namaField">
              <label for="namaPemesan">Nama Pemesan</label>
              <input id="namaPemesan" placeholder="Nama kamu" autocomplete="name">
              <div class="errmsg">Isi nama dulu ya, biar toko tahu pesanan ini dari siapa</div>
            </div>
            <div class="tipefield" id="tipeField">
              <label class="tlabel">Tipe Pesanan</label>
              <div class="tipe-opts">
                <button type="button" class="tipe-opt" data-tipe="dinein">🍽️ Makan di Tempat</button>
                <button type="button" class="tipe-opt" data-tipe="takeaway">🥡 Bawa Pulang</button>
              </div>
              <div class="errmsg">Pilih dulu ya, makan di tempat atau bawa pulang</div>
            </div>
            <div class="total"><span>Total</span><span id="dTotal">Rp0</span></div>
            ${normalizePhone(store.telp) ? "" : `<p class="nonumnote">Toko ini belum mengatur nomor WhatsApp, jadi pesanan tidak bisa dikirim lewat sini.</p>`}
            <button class="wabtn" id="sendWaBtn" type="button" ${normalizePhone(store.telp)?"":"disabled"}>💬 Pesan via WhatsApp</button>
          </div>
        </div>
      </div>
      <footer class="pw">Dibuat dengan <a href="https://anggiadip123-maker.github.io/kasirin-download/" target="_blank" rel="noopener">KASIRIN</a> — aplikasi kasir &amp; pembukuan untuk warung &amp; kafe</footer>
    `;

    renderCats(); renderGrid(); renderCartBar();

    $("#searchInput").addEventListener("input", e=>{ search=e.target.value; renderGrid(); });
    $("#catChips").addEventListener("click", e=>{
      const b=e.target.closest("[data-cat]"); if(!b) return;
      activeCat=b.dataset.cat; renderCats(); renderGrid();
    });
    $("#grid").addEventListener("click", e=>{
      const card=e.target.closest(".pcard"); if(!card) return;
      const p=products.find(x=>x.id===card.dataset.pid); if(!p) return;
      if(e.target.closest("[data-add]")){
        const sel=card.querySelector(".varsel");
        addToCart(p, sel?sel.value:null);
      } else if(e.target.closest("[data-inc]")){
        addToCart(p, null);
      } else if(e.target.closest("[data-dec]")){
        changeQty(cartKey(p,null), -1);
      }
    });
    $("#openCartBtn").addEventListener("click", openDrawer);
    $("#closeDrawerBtn").addEventListener("click", closeDrawer);
    $("#drawerBack").addEventListener("click", e=>{ if(e.target.id==="drawerBack") closeDrawer(); });
    $("#ditems").addEventListener("click", e=>{
      const row=e.target.closest(".ditem"); if(!row) return;
      const key=row.dataset.key;
      if(e.target.closest("[data-inc]")) changeQty(key, 1);
      else if(e.target.closest("[data-dec]")) changeQty(key, -1);
    });
    $("#sendWaBtn").addEventListener("click", sendToWhatsApp);
    $("#tipeField").addEventListener("click", e=>{
      const b=e.target.closest("[data-tipe]"); if(!b) return;
      orderTipe=b.dataset.tipe;
      document.querySelectorAll(".tipe-opt").forEach(x=>x.classList.toggle("active", x.dataset.tipe===orderTipe));
      $("#tipeField").classList.remove("show-err");
    });
  }

  let db=null, authP=null;
  // Login anonim dipakai cuma supaya pelanggan bisa KIRIM pesanan (Security Rules mewajibkan
  // request.auth != null untuk menulis) -- tidak ada layar login/isi apa pun, otomatis di
  // belakang layar. Baca katalog (lihat produk) tidak butuh ini sama sekali.
  function ensureAuth(){
    if(!authP) authP = firebase.auth().signInAnonymously();
    return authP;
  }
  async function load(){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      ensureAuth().catch(()=>{}); // mulai di belakang layar, tidak perlu ditunggu buat lihat katalog
      const ref = db.collection("katalogToko").doc(storeKey);
      const storeSnap = await ref.get();
      if(!storeSnap.exists){ showState("Toko tidak ditemukan, atau Katalog Online belum diaktifkan pemiliknya."); return; }
      store = storeSnap.data();
      document.title = (store.nama||"Toko") + " — Katalog";
      const prodSnap = await ref.collection("produk").get();
      products = prodSnap.docs.map(d=>Object.assign({id:d.id}, d.data()));
      if(!products.length){ showState("Katalog toko ini masih kosong."); return; }
      renderShell();
    }catch(e){
      showState("Gagal memuat katalog. Cek koneksi internet lalu muat ulang halaman.");
    }
  }
  load();
})();
</script>
</body>
</html>
